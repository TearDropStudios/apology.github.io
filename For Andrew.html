<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Andrew</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..500;1,6..72,300..500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5eee8; --ink:#2a2440; --muted:#7d7390; --blob1:#e7b7a0; --blob2:#b9a8d6;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13152a; --ink:#f1e9e4; --muted:#8f88a8; --blob1:#c9795c; --blob2:#5a4a94; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13152a; --ink:#f1e9e4; --muted:#8f88a8; --blob1:#c9795c; --blob2:#5a4a94; color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink); overflow:hidden;
  font-family:"Newsreader",Georgia,"Times New Roman",serif;
  -webkit-font-smoothing:antialiased; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:background .6s ease;
}
.glow{position:fixed;inset:0;overflow:hidden;pointer-events:none;opacity:0;animation:glowIn 4s ease .2s forwards}
.glow i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.42}
.glow i:nth-child(1){width:55vmax;height:55vmax;background:var(--blob1);left:-18vmax;bottom:-24vmax;animation:drift1 26s ease-in-out infinite alternate}
.glow i:nth-child(2){width:48vmax;height:48vmax;background:var(--blob2);right:-16vmax;top:-22vmax;animation:drift2 32s ease-in-out infinite alternate}
@keyframes glowIn{to{opacity:1}}
@keyframes drift1{to{transform:translate(9vmax,-6vmax) scale(1.12)}}
@keyframes drift2{to{transform:translate(-8vmax,7vmax) scale(1.08)}}

main{position:relative;width:min(92vw,34rem);min-height:60vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:2rem 0}
.line{
  font-size:clamp(1.55rem,5.4vw,2.35rem); line-height:1.38; font-weight:350;
  font-variation-settings:"opsz" 48; letter-spacing:-.005em; text-wrap:balance;
}
.line.big{font-size:clamp(3rem,14vw,5.6rem);font-style:italic;font-weight:300;letter-spacing:-.02em}
.line.small{font-size:clamp(1.15rem,3.8vw,1.45rem);color:var(--muted);font-style:italic}
.w{display:inline-block;opacity:0;filter:blur(8px);transform:translateY(.35em);
   animation:wIn 1.1s cubic-bezier(.2,.7,.2,1) forwards;white-space:pre}
@keyframes wIn{to{opacity:1;filter:blur(0);transform:none}}
.line.out{animation:out .9s ease forwards}
@keyframes out{to{opacity:0;filter:blur(6px);transform:translateY(-.4em)}}

.sig{margin-top:2.2rem;font-size:1.3rem;font-style:italic;color:var(--muted);opacity:0;animation:fade 1.6s ease forwards}
.again{
  margin-top:2.4rem;font:inherit;font-size:1rem;color:var(--muted);background:none;
  border:1px solid color-mix(in srgb,var(--muted) 45%,transparent);border-radius:999px;
  padding:.55rem 1.3rem;cursor:pointer;opacity:0;animation:fade 1.6s ease 1.2s forwards;
  transition:color .3s,border-color .3s;
}
.again:hover{color:var(--ink);border-color:var(--ink)}
.again:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
@keyframes fade{to{opacity:1}}

.hint{position:fixed;left:0;right:0;bottom:calc(1.6rem + env(safe-area-inset-bottom,0px));text-align:center;
  font-size:.95rem;font-style:italic;color:var(--muted);opacity:0;transition:opacity 1s ease;pointer-events:none}
.hint.on{opacity:.75}
.dots{position:fixed;top:calc(1.4rem + env(safe-area-inset-top,0px));left:0;right:0;display:flex;justify-content:center;gap:.5rem}
.dots b{width:5px;height:5px;border-radius:50%;background:var(--muted);opacity:.28;transition:opacity .6s,transform .6s}
.dots b.on{opacity:.9;transform:scale(1.35)}

@media (prefers-reduced-motion: reduce){
  .glow i{animation:none}
  .w{animation-duration:.01s;filter:none;transform:none}
}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"><i></i><i></i></div>
<div class="dots" id="dots" aria-hidden="true"></div>
<main id="stage" aria-live="polite"></main>
<div class="hint" id="hint">tap anywhere to continue</div>

<script>
// ✏️ Edit these two to personalise it
const FROM = "";            // e.g. "Alex" — leave empty to skip the signature
const SCENES = [
  { t: "Andrew,", cls: "big", hold: 1500 },
  { t: "I’ve been wanting to say this properly, and a text didn’t feel like enough." },
  { t: "I’m really sorry. I messed up, and I know it." },
  { t: "You didn’t deserve that. You’re a good friend, and I didn’t treat you like one." },
  { t: "I’m not asking you to say it’s okay. I just wanted you to hear it from me." },
  { t: "Whenever you’re ready, I’d love to hang out again. Games, bikes, whatever you want. You pick." },
  { t: "Take all the time you need.", cls: "small", last: true }
];

const stage = document.getElementById("stage");
const hint = document.getElementById("hint");
const dots = document.getElementById("dots");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
SCENES.forEach(() => dots.appendChild(document.createElement("b")));

let i = 0, timer = null, busy = false, current = null;

function build(scene){
  const el = document.createElement("p");
  el.className = "line " + (scene.cls || "");
  const words = scene.t.split(" ");
  words.forEach((w, k) => {
    const s = document.createElement("span");
    s.className = "w";
    s.textContent = w + (k < words.length - 1 ? " " : "");
    s.style.animationDelay = (k * (reduce ? 0 : 110)) + "ms";
    el.appendChild(s);
  });
  return { el, words: words.length };
}

function show(n){
  clearTimeout(timer);
  i = n; busy = true;
  [...dots.children].forEach((d, k) => d.classList.toggle("on", k === n));
  stage.innerHTML = "";
  const scene = SCENES[n];
  const { el, words } = build(scene);
  stage.appendChild(el);
  current = el;

  const typing = words * 110 + 900;
  setTimeout(() => { busy = false; if (n > 0 && !scene.last) hint.classList.add("on"); }, typing);

  if (scene.last) {
    if (FROM) {
      const sig = document.createElement("p");
      sig.className = "sig"; sig.textContent = "— " + FROM;
      sig.style.animationDelay = (typing + 600) + "ms";
      stage.appendChild(sig);
    }
    const b = document.createElement("button");
    b.className = "again"; b.textContent = "read it again";
    b.style.animationDelay = (typing + 1200) + "ms";
    b.addEventListener("click", e => { e.stopPropagation(); hint.classList.remove("on"); show(0); });
    stage.appendChild(b);
    hint.classList.remove("on");
    return;
  }
  // natural reading pace: ~320ms per word plus a breath
  timer = setTimeout(next, scene.hold || (typing + words * 320 + 1500));
}

function next(){
  clearTimeout(timer);
  if (i >= SCENES.length - 1) return;
  hint.classList.remove("on");
  if (current) current.classList.add("out");
  const go = i + 1;
  timer = setTimeout(() => show(go), reduce ? 50 : 850);
}

document.addEventListener("click", () => { if (!busy) next(); });
document.addEventListener("keydown", e => {
  if ((e.key === " " || e.key === "Enter" || e.key === "ArrowRight") && e.target.tagName !== "BUTTON") {
    e.preventDefault(); if (!busy) next();
  }
});

setTimeout(() => show(0), 700);
</script>
</body>
</html>
